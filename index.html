<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Feed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container gap-3">
      <span class="navbar-brand mb-0 h1">Personal Feed</span>
      <div class="ms-auto search-box-wrap">
        <label for="searchBox" class="visually-hidden">Search posts</label>
        <input id="searchBox" class="form-control form-control-sm" type="search" placeholder="Search posts..." autocomplete="off">
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <section class="composer card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">What would you like to save?</h2>
          <span id="charCount" class="small text-muted">0 / 5000</span>
        </div>
        <form id="postForm">
          <textarea id="postContent" class="form-control form-control-lg" rows="6" maxlength="5000" placeholder="Write a note, thought, update, or reminder..." required></textarea>

          <div class="mt-3">
            <label for="postImage" class="form-label fw-semibold">Optional image</label>
            <input id="postImage" class="form-control" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <div class="form-text">JPEG, PNG, GIF, or WebP. Maximum 5 MB.</div>
            <div id="postImagePreview" class="image-preview d-none mt-3">
              <img id="postImagePreviewImg" alt="Selected image preview">
              <div class="small text-muted mt-2" id="postImageInfo"></div>
              <button id="clearPostImage" type="button" class="btn btn-outline-secondary btn-sm mt-2">Remove selected image</button>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mt-3">
            <div id="formMessage" class="small"></div>
            <button id="submitBtn" type="submit" class="btn btn-primary px-4">Submit Post</button>
          </div>
        </form>
      </div>
    </section>

    <section class="feed card shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <div class="min-width-0">
          <h2 class="h5 mb-0">Posts</h2>
          <div id="feedMeta" class="small text-muted">Loading...</div>
        </div>
        <div class="d-flex gap-2">
          <button id="exportBtn" class="btn btn-success btn-sm" type="button">Export ZIP</button>
          <button id="refreshBtn" class="btn btn-outline-secondary btn-sm" type="button">Refresh</button>
        </div>
      </div>
      <div class="card-body p-0">
        <div id="loading" class="p-4 text-center text-muted d-none">
          <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
          Loading posts...
        </div>
        <div id="emptyState" class="p-5 text-center d-none">
          <div class="display-6 mb-2">📝</div>
          <h3 class="h5">No posts found</h3>
          <p id="emptyText" class="text-muted mb-0">Create your first post using the textarea above.</p>
        </div>
        <div id="postsList" class="list-group list-group-flush"></div>
      </div>
      <div class="card-footer bg-white">
        <nav aria-label="Post pagination">
          <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
        </nav>
      </div>
    </section>
  </main>

  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit post</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editPostId">
            <input type="hidden" id="editRemoveImage" value="false">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label for="editContent" class="form-label fw-semibold mb-0">Post text</label>
              <span id="editCharCount" class="small text-muted">0 / 5000</span>
            </div>
            <textarea id="editContent" class="form-control" rows="8" maxlength="5000" required></textarea>

            <div id="currentImageWrap" class="mt-3 d-none">
              <div class="form-label fw-semibold">Current image</div>
              <div class="image-preview">
                <img id="currentImage" alt="Current post image">
                <button id="removeCurrentImage" type="button" class="btn btn-outline-danger btn-sm mt-2">Remove current image</button>
              </div>
            </div>

            <div class="mt-3">
              <label for="editImage" class="form-label fw-semibold">Replace/add image</label>
              <input id="editImage" class="form-control" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
              <div class="form-text">Leave blank to keep the current image.</div>
              <div id="editImagePreview" class="image-preview d-none mt-3">
                <img id="editImagePreviewImg" alt="Selected replacement image preview">
                <div class="small text-muted mt-2" id="editImageInfo"></div>
                <button id="clearEditImage" type="button" class="btn btn-outline-secondary btn-sm mt-2">Remove selected image</button>
              </div>
            </div>
            <div id="editMessage" class="small mt-3"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button id="saveEditBtn" type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
